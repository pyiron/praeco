# This runs cron jobs daily

name: Daily

on:
  schedule:
    - cron: '0 23 * * *'

jobs:
  codeql:
    uses: pyiron/actions/.github/workflows/tests-and-coverage.yml@actions-4.3.0
    secrets: inherit
    with:
      # Miniforge installer for every job that builds a conda environment; pin a release here if latest breaks
      miniforge-version: 'latest'
      do-coveralls: false
      do-codecov: true
