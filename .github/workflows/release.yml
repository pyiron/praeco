name: Release

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  hatch-release:
    uses: pyiron/actions/.github/workflows/hatch-release.yml@actions-4.3.0
    secrets: inherit
    with:
      # Miniforge installer for every job that builds a conda environment; pin a release here if latest breaks
      miniforge-version: 'latest'
      semantic-upper-bound: 'minor'
      lower-bound-yaml: '.ci_support/lower-bounds.yml'
      publish-to-pypi: ${{ github.event_name == 'release' && github.event.action == 'published' }}
